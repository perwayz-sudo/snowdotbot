# The "git-based cron": runs the bot's heartbeat on a schedule, so the 8:00
# morning report (greeting included), rain/temperature alerts and the reminder
# extras go out even when you're not chatting with the bot.
#
# How it works: `tgcloud run` sends this repo's modules to the cloud and runs
# them there — no deploy needed. The heartbeat sends each event at most once
# (dedupe lives in the subscribers.seen map), so running the pulse often is
# safe and exact-minute precision isn't required.
#
# Setup (once):
#   1. Push this repo to GitHub (public or private).
#   2. Repo → Settings → Secrets and variables → Actions → New repository
#      secret: name TGCLOUD_TOKEN, value = your CLI access token
#      (BotFather → your bot → Serverless → CLI Access → Access token).
#
# Notes:
#   - GitHub cron runs in UTC and can be a few minutes late; every 30 minutes
#     means the report lands shortly after 08:00 city-local time.
#   - This is a *public* repo, so the schedule runs on the free unlimited
#     Actions minutes and the logs print only a "checked: N" summary — chat
#     IDs stay out of the public log (on failure the log is printed with long
#     numbers redacted).
#   - If you ever switch this repo to private, calm the cron down to
#     "0 * * * *" (hourly) — 30-minute runs would eat the free 2,000 min/mo.
#   - Scheduled workflows are paused after 60 days without repo activity —
#     re-enable from the Actions tab if that happens.
name: pulse

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch: {}

# Never let two pulses overlap — parallel runs could double-send.
concurrency:
  group: pulse
  cancel-in-progress: false

jobs:
  pulse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run the heartbeat for every subscriber
        run: |
          status=0
          npx tgcloud run endpoints/pulse > pulse.log 2>&1 || status=$?
          grep -o 'checked:[0-9]*' pulse.log || echo "no summary line in output"
          if [ "$status" -ne 0 ]; then
            echo "pulse failed (exit $status):"
            sed -E 's/[0-9]{6,}/[redacted]/g' pulse.log
            exit 1
          fi
        env:
          TGCLOUD_TOKEN: ${{ secrets.TGCLOUD_TOKEN }}
